name: Refresh daily prices

# Runs entirely on GitHub's infrastructure, independent of whether a Cowork
# session happens to be open. This is what closes the price-staleness gap
# documented in docs/FUNDAMENTALS_INTEGRATION.md (sections 5-1, 5-4, 9-3):
# a batch refresh of every ticker in ops/tickers.txt, committed straight
# back to the repo as ops/prices/daily_prices.csv.
#
# Provider: Alpha Vantage (docs/FUNDAMENTALS_INTEGRATION.md 9-9, 9-10, 9-11, 9-12).
# Stooq was the original choice because it needed no key, but by 2026-09 it
# requires passing a JavaScript proof-of-work challenge that only a real
# browser can complete -- this project does not automate bot-detection
# bypasses, so the default provider is Alpha Vantage instead. Requires the
# ALPHAVANTAGE_API_KEY secret; use a key DEDICATED to this workflow rather
# than reusing whatever key the manual same-day-prep flow uses locally --
# both draw against the same account's 25-calls/day free-tier cap, and a
# shared key means this workflow's automated runs can silently starve (or
# be starved by) that flow's daily budget. A single key's free tier can't
# cover all 44 tickers in one run, so by default this only attempts
# ops/prices/refresh_cursor.txt's next batch (20 tickers) and rotates --
# see the refresh_daily_prices.py module docstring.
#
# Optional: ALPHAVANTAGE_API_KEY_2 and ALPHAVANTAGE_API_KEY_3 secrets add
# backup capacity from their own separate free Alpha Vantage accounts/keys
# (not required, referencing a secret that doesn't exist just resolves to an
# empty string) -- if the current key gets rejected mid-batch, the next one
# is tried instead of just failing that ticker. They deliberately do NOT
# raise the 20-ticker batch size, though: a real run with 3 keys registered
# only got ~25 calls/day through in total rather than 75, so assuming more
# keys means more throughput would risk silently starving whichever tickers
# land after that real cutoff, every single day (9-12).

on:
  schedule:
    # 21:30 UTC = 06:30 KST, after the US regular session has closed
    # (16:00 America/New_York) and the day's close is available.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily price refresh
        env:
          PYTHONPATH: src
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ALPHAVANTAGE_API_KEY_2: ${{ secrets.ALPHAVANTAGE_API_KEY_2 }}
          ALPHAVANTAGE_API_KEY_3: ${{ secrets.ALPHAVANTAGE_API_KEY_3 }}
        run: |
          python -m multica_quant_ops.data.refresh_daily_prices \
            --tickers-file ops/tickers.txt \
            --output ops/prices/daily_prices.csv

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `git diff --quiet` only compares tracked files -- on the very
          # first run these files don't exist yet, so they're untracked and
          # `git diff` silently ignores them, making this look like "no
          # changes" even though they were just created. Stage first, then
          # check the *staged* diff against HEAD, which correctly reports
          # a new file as a change too (docs/FUNDAMENTALS_INTEGRATION.md 9-6).
          # alphavantage_usage_2/_3.json only exist once a second/third key
          # is registered and actually used (9-11) -- add them if present,
          # skip quietly otherwise rather than failing the step.
          for f in ops/prices/daily_prices.csv ops/prices/refresh_cursor.txt \
                   ops/prices/alphavantage_usage.json ops/prices/alphavantage_usage_2.json \
                   ops/prices/alphavantage_usage_3.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No price changes to commit."
            exit 0
          fi
          git commit -m "Refresh daily prices ($(date -u +%Y-%m-%d))"
          git push
