[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true

[project]
name = "multica-quant-ops"
version = "0.1.0"
description = "Agent teammate platform for US equities quant operations"
requires-python = ">=3.11"

[project.scripts]
multica-quant-ops = "multica_quant_ops.cli:main"
multica-quant-ops-api = "multica_quant_ops.api.http:main"
multica-quant-ops-scheduler = "multica_quant_ops.scheduler:main"
multica-quant-ops-same-day = "multica_quant_ops.same_day:main"
multica-quant-ops-same-day-batch = "multica_quant_ops.same_day_batch:main"
multica-quant-ops-dashboard = "multica_quant_ops.dashboard_export:main"
